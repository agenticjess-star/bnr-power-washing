<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Greater Houston service area map showing B&amp;R Power Washing's coverage zones across Memorial, River Oaks, The Heights, Galleria, Katy, Sugar Land, Pearland, The Woodlands, and surrounding neighborhoods" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#EAEEF6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F8F7F4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#152B4F" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#152B4F" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="pinGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="400" cy="420" r="320" fill="url(#bgGrad)"/>

  <g stroke="#152B4F" stroke-opacity="0.05" stroke-width="0.8" fill="none">
    <line x1="400" y1="80" x2="400" y2="760"/>
    <line x1="80" y1="420" x2="720" y2="420"/>
  </g>

  <path d="M 250 220 C 200 250 180 320 200 380 C 175 420 195 480 230 510 C 245 575 305 605 365 600 C 415 625 485 615 530 590 C 580 595 625 555 635 510 C 670 485 670 425 645 385 C 660 335 625 285 575 270 C 540 220 470 200 410 215 C 350 195 290 195 250 220 Z"
        fill="#FFFFFF" stroke="url(#hStroke)" stroke-width="1.4"/>

  <ellipse cx="410" cy="420" rx="200" ry="190" fill="none" stroke="#152B4F" stroke-opacity="0.18" stroke-width="1.2" stroke-dasharray="2 4"/>

  <ellipse cx="395" cy="420" rx="90" ry="85" fill="none" stroke="#152B4F" stroke-opacity="0.28" stroke-width="1.4"/>

  <g stroke="#152B4F" stroke-opacity="0.22" stroke-width="1.6" fill="none" stroke-linecap="round">
    <path d="M 90 410 Q 240 400 305 410"/>
    <path d="M 485 410 Q 580 400 720 405"/>
    <path d="M 395 100 Q 405 220 395 335"/>
    <path d="M 395 505 Q 410 620 415 740"/>
    <path d="M 200 250 Q 290 320 360 380"/>
    <path d="M 600 245 Q 510 310 440 380"/>
  </g>

  <circle cx="395" cy="420" r="5" fill="#152B4F" opacity="0.5"/>
  <text x="395" y="445" text-anchor="middle" font-family="Hanken Grotesk, sans-serif" font-size="10" fill="#152B4F" opacity="0.7" letter-spacing="1.5">DOWNTOWN</text>

  <g class="map-pin"><circle cx="345" cy="365" r="10" fill="#B8943F"/><circle cx="345" cy="365" r="5" fill="#FFFFFF"/><text x="345" y="345" text-anchor="middle" font-family="Hanken Grotesk, sans-serif" font-size="13" font-weight="600" fill="#152B4F">Memorial</text></g>

  <g class="map-pin"><circle cx="380" cy="405" r="9" fill="#152B4F"/><circle cx="380" cy="405" r="4" fill="#FFFFFF"/><text x="395" y="410" font-family="Hanken Grotesk, sans-serif" font-size="11" fill="#152B4F">River Oaks</text></g>

  <g class="map-pin"><circle cx="395" cy="355" r="9" fill="#152B4F"/><circle cx="395" cy="355" r="4" fill="#FFFFFF"/><text x="395" y="338" text-anchor="middle" font-family="Hanken Grotesk, sans-serif" font-size="13" font-weight="600" fill="#152B4F">The Heights</text></g>

  <g class="map-pin"><circle cx="335" cy="410" r="7" fill="#152B4F"/><text x="320" y="415" text-anchor="end" font-family="Hanken Grotesk, sans-serif" font-size="11" fill="#152B4F">Tanglewood</text></g>

  <g class="map-pin"><circle cx="335" cy="445" r="10" fill="#B8943F"/><circle cx="335" cy="445" r="5" fill="#FFFFFF"/><text x="320" y="465" text-anchor="end" font-family="Hanken Grotesk, sans-serif" font-size="13" font-weight="600" fill="#152B4F">Galleria</text></g>

  <g class="map-pin"><circle cx="375" cy="475" r="7" fill="#152B4F"/><text x="395" y="495" font-family="Hanken Grotesk, sans-serif" font-size="11" fill="#152B4F">Bellaire / West U</text></g>

  <g class="map-pin"><circle cx="290" cy="365" r="7" fill="#152B4F"/><text x="290" y="345" text-anchor="middle" font-family="Hanken Grotesk, sans-serif" font-size="11" fill="#152B4F">Spring Branch</text></g>

  <g class="map-pin"><circle cx="215" cy="270" r="9" fill="#152B4F"/><circle cx="215" cy="270" r="4" fill="#FFFFFF"/><text x="215" y="252" text-anchor="middle" font-family="Hanken Grotesk, sans-serif" font-size="13" font-weight="600" fill="#152B4F">Cypress</text></g>

  <g class="map-pin"><circle cx="195" cy="395" r="10" fill="#B8943F"/><circle cx="195" cy="395" r="5" fill="#FFFFFF"/><text x="180" y="400" text-anchor="end" font-family="Hanken Grotesk, sans-serif" font-size="13" font-weight="600" fill="#152B4F">Katy</text></g>

  <g class="map-pin"><circle cx="245" cy="540" r="10" fill="#B8943F"/><circle cx="245" cy="540" r="5" fill="#FFFFFF"/><text x="245" y="565" text-anchor="middle" font-family="Hanken Grotesk, sans-serif" font-size="13" font-weight="600" fill="#152B4F">Sugar Land</text></g>

  <g class="map-pin"><circle cx="445" cy="580" r="9" fill="#152B4F"/><circle cx="445" cy="580" r="4" fill="#FFFFFF"/><text x="445" y="605" text-anchor="middle" font-family="Hanken Grotesk, sans-serif" font-size="13" font-weight="600" fill="#152B4F">Pearland</text></g>

  <g class="map-pin"><circle cx="495" cy="225" r="7" fill="#152B4F"/><text x="495" y="207" text-anchor="middle" font-family="Hanken Grotesk, sans-serif" font-size="11" fill="#152B4F">Spring</text></g>

  <g class="map-pin"><circle cx="525" cy="155" r="10" fill="#B8943F"/><circle cx="525" cy="155" r="5" fill="#FFFFFF"/><text x="525" y="135" text-anchor="middle" font-family="Hanken Grotesk, sans-serif" font-size="13" font-weight="600" fill="#152B4F">The Woodlands</text></g>

  <g class="map-pin"><circle cx="305" cy="225" r="7" fill="#152B4F"/><text x="305" y="207" text-anchor="middle" font-family="Hanken Grotesk, sans-serif" font-size="11" fill="#152B4F">Tomball</text></g>

  <g transform="translate(720, 110)" opacity="0.7"><circle r="22" fill="none" stroke="#152B4F" stroke-opacity="0.4" stroke-width="0.8"/><path d="M 0 -18 L 4 0 L 0 18 L -4 0 Z" fill="#152B4F" fill-opacity="0.6"/><text y="-26" text-anchor="middle" font-family="Hanken Grotesk, sans-serif" font-size="9" font-weight="700" fill="#152B4F" letter-spacing="1.5">N</text><text y="36" text-anchor="middle" font-family="Hanken Grotesk, sans-serif" font-size="9" fill="#152B4F" opacity="0.6">S</text></g>

  <g transform="translate(100, 720)"><text x="0" y="0" font-family="Playfair Display, serif" font-style="italic" font-size="14" fill="#152B4F">B&amp;R</text><text x="0" y="16" font-family="Hanken Grotesk, sans-serif" font-size="9" font-weight="600" fill="#152B4F" letter-spacing="2" opacity="0.7">SERVICE AREA · GREATER HOUSTON</text></g>

  <g transform="translate(580, 700)" font-family="Hanken Grotesk, sans-serif" font-size="10" fill="#152B4F"><circle cx="0" cy="0" r="6" fill="#B8943F"/><circle cx="0" cy="0" r="3" fill="#FFFFFF"/><text x="14" y="3">Primary service hub</text><circle cx="0" cy="20" r="5" fill="#152B4F"/><text x="14" y="23">Coverage area</text></g>
</svg>
